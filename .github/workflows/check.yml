name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: cargo fmt --manifest-path crates/pulsify-protocol/Cargo.toml --check
      - run: bun run test:rust
      - run: bun run test:interop
      - run: bun run build
      - run: bun run build:website
      - run: bun run test:package
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run test:runtimes
      - run: bun run test:example
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path packages/cloud-server/unikraft-cloud/server/Cargo.toml --check
      - run: cargo test --manifest-path packages/cloud-server/unikraft-cloud/server/Cargo.toml
      - run: bun run test:cloud --backend cloudflare
  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            packages/connectors/Tauri/crates/*/target
          key: tauri-${{ hashFiles('packages/connectors/Tauri/crates/*/Cargo.lock') }}
      # tauri links GTK and WebKitGTK (JavaScriptCore) on Linux even without a webview.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: |
          for crate in pulsify-sqlite tauri-plugin-pulsify; do
            manifest=packages/connectors/Tauri/crates/$crate/Cargo.toml
            cargo fmt --manifest-path $manifest --check
            cargo clippy --manifest-path $manifest --all-targets -- -D warnings
            cargo test --manifest-path $manifest
          done
  rocksdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/pulsify-rocksdb/target
          key: rocksdb-${{ runner.os }}-${{ hashFiles('crates/pulsify-rocksdb/Cargo.lock') }}
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path crates/pulsify-rocksdb/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path crates/pulsify-rocksdb/Cargo.toml --all-targets -- -D warnings
      # The Rust suite, shared with pulsify-sqlite, then real documents through the harness.
      - run: bun run test:rocksdb
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/pulsify-db-bench/target
          key: storage-${{ runner.os }}-${{ hashFiles('crates/pulsify-db-bench/Cargo.lock', 'crates/pulsify-db-bench/Cargo.toml') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:storage
      - run: bun run test:database:rust
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run bench --quick --output benchmarks/results/ci.json > /tmp/pulsify-bench.json
      - run: bun run bench:crdt --quick --output benchmarks/results/crdt-ci.json --markdown benchmarks/results/crdt-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/ci.json
            benchmarks/results/crdt-ci.json
            benchmarks/results/crdt-ci.md
