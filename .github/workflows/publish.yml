name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
          version=$(jq -r .version packages/pulse/package.json)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version."
            exit 1
          fi
  npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Skip versions already on npm so a release can be retried.
      - run: |
          for dir in packages/pulse packages/cloud packages/cloud-server packages/pulsify-react packages/pulsify-svelte packages/pulsify-vue packages/pulsify-solid packages/pulsify-lexical packages/pulsify-prosemirror packages/connectors/IndexedDB packages/connectors/Tauri packages/connectors/Electron; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
  website:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Deploy the website
        run: bun run deploy:website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
