name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
          version=$(jq -r .version packages/pulse/package.json)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version."
            exit 1
          fi
          python3 - "$version" <<'PY'
          import sys
          import tomllib

          for manifest in (
              "crates/pulsify-protocol/Cargo.toml",
              "packages/connectors/Tauri/crates/pulsify-sqlite/Cargo.toml",
              "packages/connectors/Tauri/crates/tauri-plugin-pulsify/Cargo.toml",
              "crates/pulsify-rocksdb/Cargo.toml",
          ):
              with open(manifest, "rb") as source:
                  package = tomllib.load(source)["package"]
              if package["version"] != sys.argv[1]:
                  sys.exit(f"::error::{manifest} must use release version {sys.argv[1]}.")
          PY
  npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Skip versions already on npm so a release can be retried.
      - run: |
          for dir in packages/pulse packages/cloud packages/cloud-server packages/pulsify-react packages/pulsify-svelte packages/pulsify-vue packages/pulsify-solid packages/pulsify-lexical packages/pulsify-prosemirror packages/pulsify-codemirror packages/connectors/IndexedDB packages/connectors/Tauri packages/connectors/Electron; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
  crates:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            packages/connectors/Tauri/crates/*/target
            crates/pulsify-rocksdb/target
          key: crates-${{ hashFiles('packages/connectors/Tauri/crates/*/Cargo.lock', 'crates/pulsify-rocksdb/Cargo.lock') }}
      # Tauri links GTK and WebKitGTK on Linux, including during package verification.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for manifest in crates/pulsify-protocol/Cargo.toml packages/connectors/Tauri/crates/pulsify-sqlite/Cargo.toml packages/connectors/Tauri/crates/tauri-plugin-pulsify/Cargo.toml crates/pulsify-rocksdb/Cargo.toml; do
            metadata=$(cargo metadata --no-deps --format-version 1 --manifest-path "$manifest")
            name=$(jq -r '.packages[0].name' <<< "$metadata")
            version=$(jq -r '.packages[0].version' <<< "$metadata")
            status=$(curl --silent --show-error --retry 3 \
              --user-agent "pulsify-release (https://github.com/Gin-Quin/pulsify)" \
              --output "$response_file" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name@$version already published" ;;
              # cargo publish waits for the registry index before the next crate.
              404) cargo publish --locked --manifest-path "$manifest" ;;
              *)
                echo "::error::Failed to check $name@$version on crates.io (HTTP $status)."
                exit 1
                ;;
            esac
          done
  website:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Deploy the website
        run: bun run deploy:website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
