[package]
name = "pulsify-db-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clickhouse = "0.15.3"
db-key = "0.0.5"
flate2 = "1"
heed = "0.22"
leveldb = "0.8.6"
leveldb-sys = "2.0.9"
postgres = "0.19"
pulsify-protocol = { path = "../pulsify-protocol" }
redis = "1.8.1"
# Without RocksDB's bundled Snappy, which collides at link time with the one
# LevelDB needs for its standard compression.
rocksdb = { version = "0.25.0", default-features = false, features = [
	"lz4",
	"zstd",
	"bindgen-runtime",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
scylla = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
