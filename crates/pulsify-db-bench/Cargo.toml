[package]
name = "pulsify-db-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Regression tests use SQLite, RocksDB and LMDB. Other engines are needed only
# by the full benchmark binary, whose default build retains them all.
[features]
default = ["other-databases"]
other-databases = [
	"dep:clickhouse",
	"dep:db-key",
	"dep:leveldb",
	"dep:leveldb-sys",
	"dep:postgres",
	"dep:redis",
	"dep:scylla",
	"dep:tokio",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clickhouse = { version = "0.15.3", optional = true }
db-key = { version = "0.0.5", optional = true }
flate2 = "1"
heed = "0.22"
leveldb = { version = "0.8.6", optional = true }
leveldb-sys = { version = "2.0.9", optional = true }
postgres = { version = "0.19", optional = true }
pulsify-protocol = { path = "../pulsify-protocol" }
redis = { version = "1.8.1", optional = true }
# Without RocksDB's bundled Snappy, which collides at link time with the one
# LevelDB needs for its standard compression.
rocksdb = { version = "0.25.0", default-features = false, features = [
	"lz4",
	"zstd",
	"bindgen-runtime",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
scylla = { version = "1.10.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", optional = true, features = ["rt-multi-thread"] }
