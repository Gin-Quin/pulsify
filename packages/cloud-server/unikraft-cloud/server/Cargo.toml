[package]
name = "pulsify-cloud-server"
version = "7.0.0"
edition = "2021"
publish = false
license = "FSL-1.1-ALv2"
description = "Pulsify Cloud server for Unikraft Cloud: authenticated WebSockets, one actor per root and PostgreSQL storage"

[dependencies]
pulsify-protocol = { path = "../../../../crates/pulsify-protocol" }
axum = { version = "0.8", default-features = false, features = [
	"http1",
	"tokio",
	"ws",
] }
base64 = "0.22"
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
	"std",
] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"sync",
	"signal",
	"time",
] }
tokio-postgres = "0.7"

[profile.release]
codegen-units = 1
lto = true
strip = true
