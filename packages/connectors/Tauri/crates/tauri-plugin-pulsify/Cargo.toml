[package]
name = "tauri-plugin-pulsify"
version = "11.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Tauri 2 plugin persisting Pulsify documents in a local SQLite database"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "pulsify", "crdt", "local-first"]
categories = ["database", "gui"]
links = "tauri-plugin-pulsify"

[dependencies]
pulsify-sqlite = { version = "11.0.0", path = "../pulsify-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
glob = "0.3"
pulsify-protocol = { version = "11.0.0", path = "../../../../../crates/pulsify-protocol" }
tauri = { version = "2", default-features = false, features = ["test"] }
