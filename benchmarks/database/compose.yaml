services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pulsify-benchmark
      POSTGRES_DB: pulsify_benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsify_benchmark"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data
  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/database/Dockerfile
    profiles: ["tools"]
    environment:
      PULSIFY_POSTGRES_URL: postgres://postgres:pulsify-benchmark@postgres/pulsify_benchmark
      BENCH_COMMIT: ${BENCH_COMMIT:-unknown}
      BENCH_DIRTY: ${BENCH_DIRTY:-unknown}
      BENCH_INFRASTRUCTURE: ${BENCH_INFRASTRUCTURE:-{}}
    volumes:
      - ${BENCH_RESULTS_DIR:-../results}:/results
volumes:
  postgres-data:
